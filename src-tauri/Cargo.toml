[package]
name = "claude-usage"
version = "0.1.0"
description = "Watches Claude subscription usage and surfaces a custom tray UI"
authors = ["Cameron Tacklind"]
edition = "2021"
default-run = "claude-usage"

[lib]
name = "claude_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for the OAuth usage endpoint
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }

# Time parsing / math for reset windows + pace projection
chrono = { version = "0.4", features = ["serde"] }

# Local time-series history for velocity/burn-rate
rusqlite = { version = "0.32", features = ["bundled"] }

# Tray icon rendering (rasterize the % into a small badge)
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"

dirs = "5"
anyhow = "1"

[features]
# Desktop-only single-instance guard is added in code; kept simple here.

[profile.release]
opt-level = "s"
lto = true
strip = true
