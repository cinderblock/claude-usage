name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build the
# Windows installers and the universal macOS .dmg, sign the updater artifacts,
# and publish a GitHub Release with the `latest.json` manifest the in-app
# updater polls (tauri-action merges each matrix job's platforms into it).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows installers (NSIS + MSI)
          - os: windows-latest
            args: ""
          # One universal .app/.dmg for both Apple Silicon and Intel. No Apple
          # Developer cert — Tauri ad-hoc signs; first launch needs the
          # quarantine flag cleared (documented in the README).
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Claude Usage v__VERSION__"
          releaseBody: "See the assets below to download and install this version."
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
